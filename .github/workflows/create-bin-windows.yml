name: Create bin Windows
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
    - run: echo "The job was automatically triggered by a ${{ github.event_name }} event."
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install make
      run: choco install make -y

    - name: Install deps
      run: make install

    - name: Create binary
      run: make create-bin

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: pvcscr-executable
        path: dist/pvcscr.exe
