name: Create bin Linux
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install deps
      run: make install

    - name: Create binary
      run: make create-bin

    - name: Upload executable
      uses: actions/upload-artifact@v4
      with:
        name: pvcscr-linux
        path: dist/pvcscr
